<!-- =====================================================================
     全局脚本错误兜底（必须最先执行）
     任何脚本报错/资源加载失败，此前都是"页面功能凭空消失、零提示"，
     移动端无法排查。这里把未捕获错误 + 未处理的 Promise 拒绝直接显示出来。
     ===================================================================== -->
<script>
(function () {
  function show(text) {
    var b = document.getElementById('banner');
    if (b) { b.hidden = false; b.className = 'banner err'; b.textContent = text; }
    var lg = document.getElementById('log');
    if (lg) lg.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text + '\n' + lg.textContent;
  }
  function later(text) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { show(text); });
    } else { show(text); }
  }
  window.addEventListener('error', function (ev) {
    // 资源（script/link/img）加载失败也会触发 error，但没有 message
    var m = (ev && (ev.message || (ev.error && ev.error.message))) || '';
    var f = (ev && ev.filename) ? String(ev.filename).split('/').pop() : '';
    var line = ev && ev.lineno ? ':' + ev.lineno : '';
    var text = m
      ? '⚠️ 脚本错误：' + m + (f ? '（' + f + line + '）' : '')
      : '⚠️ 资源加载失败：' + ((ev && ev.target && (ev.target.src || ev.target.href)) || '未知');
    window.__lastError = text;
    later(text);
  }, true);
  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev && ev.reason;
    window.__lastError = (r && r.message) || String(r);
  });
})();
</script>

<meta name="mobile-web-app-capable" content="yes" />

        </div>
        <button id="btnSessionCard" class="btn primary sm"></button>
      </div>

      <div class="rowbar">
        <select id="fStatus" class="inp">
          <option value="" data-i18n="pools.filter.ongoing">进行中</option>
          <option value="all" data-i18n="pools.filter.all">全部（含已结束）</option>
          <option value="open" data-i18n="pools.filter.open">报名中</option>
          <option value="full" data-i18n="pools.filter.full">已满员</option>

        <div class="cost-row"><span data-i18n="create.costBal">内部余额</span><b id="costBal">—</b></div>
      </div>

      <button id="btnCreate" class="btn primary block" data-i18n="create.btn">建池并支付建池费</button>

      </p>
    </section>

    <!-- ========== 我的 ========== -->
    <section class="page" id="page-me" hidden>
      <h2 class="page-title" data-i18n="me.balance">内部余额</h2>
      <div class="bal-grid">
        <div class="bal">
          <div class="k" data-i18n="me.balPaxi">PAXI</div>
          <div class="v" id="balPaxi">0</div>
        </div>
        <div class="bal">
          <div class="k" id="balTkccLabel" data-i18n="me.balTkcc">TKCC</div>
          <div class="v" id="balTkcc">0</div>
        </div>
        <div class="bal">
          <div class="k" data-i18n="me.balBank">链上 PAXI</div>
          <div class="v" id="bankPaxi">0</div>

      <div class="sess-row" id="sessRow">

    </section>

    <!-- ========== 管理（仅管理员可见） ========== -->

      <h2 class="page-title" data-i18n="admin.opsConfig">运营配置</h2>

      <h2 class="page-title" data-i18n="admin.tkccIntegration">TKCC 集成</h2>
      <p class="hint" id="tkccStatus"></p>
      <button id="btnSetTkcc" class="btn primary block" data-i18n="admin.enableTkcc"></button>

        <option value="burn" data-i18n="admin.burnBurn">Burn —— 调用 TKCC 的 burn</option>

      <div class="row wrap">
        <button id="btnSetBurnMode" class="btn" data-i18n="admin.applyBurnMode">应用销毁方式</button>

    </section>

      <span class="ico">👤</span><span data-i18n="nav.tabMe">我的</span><i class="dot" id="tabMeDot" hidden></i>
    </button>

    </button>
  </nav>

  <pre id="log" class="log"></pre>
</div>

<!-- =====================================================================
     交易 / 加密库加载器：本地 vendor 优先 + CDN 兜底
     ⚠️ 1) jsdelivr 的 /npm/@noble/hashes@x/sha256.js 是 CJS，浏览器
        import() 必炸 —— ESM 在 /esm/ 子目录；
        2) noble-hashes esm 有裸包导入 '@noble/hashes/crypto'，需 importmap；
        3) bech32@2.0.0 只有 CJS，vendor/bech32.mjs 是本地包装的 ESM。
     ===================================================================== -->
<script type="importmap">
{
  "imports": {
    "@noble/hashes/crypto": "./vendor/hashes/crypto.js",
    "@noble/hashes/utils": "./vendor/hashes/utils.js"
  }
}
</script>
<script type="module">
  const errs = [];
  async function importAny(label, urls) {
    for (const u of urls) {
      try { return await import(u); } catch (e) { errs.push(label + ' ← ' + u + ' : ' + (e && e.message)); }
    }
    throw new Error(label + ': all sources failed');
  }
  try {
    window.nobleSecp256k1 = await importAny('secp256k1', [
      './vendor/secp256k1.mjs',
      'https://cdn.jsdelivr.net/npm/@noble/secp256k1@2.1.0/index.min.js',
      'https://esm.sh/@noble/secp256k1@2.1.0',
    ]);
  } catch (e) { errs.push(e.message); }
  try {
    const [s, r] = await Promise.all([
      importAny('hashes/sha256', [
        './vendor/hashes/sha256.js',
        'https://cdn.jsdelivr.net/npm/@noble/hashes@1.4.0/esm/sha256.js',
        'https://esm.sh/@noble/hashes@1.4.0/sha256',
      ]),
      importAny('hashes/ripemd160', [
        './vendor/hashes/ripemd160.js',
        'https://cdn.jsdelivr.net/npm/@noble/hashes@1.4.0/esm/ripemd160.js',
        'https://esm.sh/@noble/hashes@1.4.0/ripemd160',
      ]),
    ]);
    window.nobleHashes = { sha256: s.sha256, ripemd160: r.ripemd160 };
  } catch (e) { errs.push(e.message); }
  try {
    const m = await importAny('bech32', ['./vendor/bech32.mjs', 'https://esm.sh/bech32@2.0.0']);
    window.bech32 = m.bech32 || (m.default && m.default.bech32) || m.default;
  } catch (e) { errs.push(e.message); }
  window.__cryptoErrors = errs;
  window.dispatchEvent(new Event('crypto-ready'));
</script>

<script>
  /* cosmjs（2.6MB）异步加载：同步 <script> 会堵住首屏；
     它是 UMD 且依赖全局 Long —— 必须先确保 Long 就位。 */
  function loadScript(src) {
    return new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve(true);
      s.onerror = () => resolve(false);
      document.head.appendChild(s);
    });
  }
  (async () => {
    if (typeof Long === 'undefined') await loadScript('./vendor/long.umd.js');
    if (typeof Long === 'undefined') await loadScript('https://cdn.jsdelivr.net/npm/long@5.2.3/umd/index.js');
    let ok = await loadScript('./vendor/paxi-cosmjs.umd.js');
    if (ok && typeof PaxiCosmJS === 'undefined') ok = false;
    if (!ok) ok = await loadScript('https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js');
    window.__cosmjsReady = !!(ok && typeof PaxiCosmJS !== 'undefined');
    window.dispatchEvent(new Event('cosmjs-ready'));
  })();
</script>
